<svg class="octy a-breathe h-shake " viewBox="0 0 200 200" role="img" aria-label="OTY octopus: Oops" xmlns="http://www.w3.org/2000/svg"><style>
.octy .body-all{transform-origin:100px 205px}
.octy .enter{animation:o-enter .45s cubic-bezier(.34,1.56,.64,1) both;transform-origin:100px 205px}
@keyframes o-enter{from{opacity:0;transform:scale(.9)}}
.octy .head{transform-origin:100px 128px}
.octy .eyes{transform-origin:100px 94px;animation:o-blink 4.6s infinite}
.octy .ba{animation:o-ripple 3.4s ease-in-out infinite;transform-box:view-box}
.octy .finL{transform-origin:48px 50px}.octy .finR{transform-origin:152px 50px}
.octy.f-perk .finL{transform:rotate(14deg)}.octy.f-perk .finR{transform:rotate(-14deg)}
.octy.f-droop .finL{transform:rotate(-22deg)}.octy.f-droop .finR{transform:rotate(22deg)}
.octy.f-flap .finL{animation:o-finL .5s ease-in-out infinite}.octy.f-flap .finR{animation:o-finR .5s ease-in-out infinite}
.octy.f-wiggle .finL{animation:o-finL 1.6s ease-in-out infinite}.octy.f-wiggle .finR{animation:o-finR 1.6s ease-in-out infinite}
@keyframes o-blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@keyframes o-ripple{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r,3deg))}}
@keyframes o-finL{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg)}}
@keyframes o-finR{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@keyframes o-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes o-bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.97,1.03)}60%{transform:translateY(0) scale(1.04,.96)}}
@keyframes o-hop{0%,100%{transform:translateY(0)}20%{transform:translateY(-20px)}40%{transform:translateY(0)}}
@keyframes o-swim{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(2px) scale(1.04,.95)}55%{transform:translateY(-16px) scale(.96,1.05)}}
@keyframes o-nod{0%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}50%{transform:rotate(-2deg)}}
@keyframes o-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes o-tilt{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-5deg)}}
@keyframes o-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes o-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
@keyframes o-peek{0%,100%{transform:translateY(96px)}35%,65%{transform:translateY(30px)}}
@keyframes o-pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes o-rise{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
@keyframes o-spin{to{transform:rotate(360deg)}}
@keyframes o-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes o-talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes o-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes o-flapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes o-flapL{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes o-conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),150px) rotate(220deg)}}
@keyframes o-ink{0%{opacity:0;transform:scale(.4)}25%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes o-glow{0%,100%{fill:#C4C6FF}50%{fill:#FFD34D}}
@keyframes o-flush{0%,100%{fill:#C4C6FF}50%{fill:#FF7F6E}}
@keyframes o-rainbow{0%,100%{fill:#C4C6FF}20%{fill:#FFC23D}40%{fill:#7BD88F}60%{fill:#8FD3FF}80%{fill:#A9A2FF}}
@keyframes o-camo{0%,100%{opacity:.5}50%{opacity:.8}}
.octy.a-bob .body-all{animation:o-bob 3.2s ease-in-out infinite}
.octy.a-bounce .body-all{animation:o-bounce 1.1s cubic-bezier(.3,.7,.2,1) infinite}
.octy.a-hop .body-all{animation:o-hop 1.4s cubic-bezier(.3,.7,.2,1) infinite}
.octy.a-swim .body-all{animation:o-swim 1.6s cubic-bezier(.3,.7,.2,1) infinite}
.octy.a-sway .body-all{animation:o-sway 3s ease-in-out infinite;transform-origin:100px 210px}
.octy.a-breathe .body-all{animation:o-breathe 3.6s ease-in-out infinite}
.octy.a-peek .body-all{animation:o-peek 4s ease-in-out infinite}
.octy.h-nod .head{animation:o-nod 1.6s ease-in-out infinite}
.octy.h-shake .head{animation:o-shake 1.2s ease-in-out infinite}
.octy.h-tilt .head{animation:o-tilt 2.4s ease-in-out infinite}
.octy .m-wave{animation:o-wave .9s ease-in-out infinite}
.octy .m-flapR{animation:o-flapR .5s ease-in-out infinite}.octy .m-flapL{animation:o-flapL .5s ease-in-out infinite}
.octy.t-glow .spots circle{animation:o-glow 1.4s ease-in-out infinite}
.octy.t-flush .spots circle{animation:o-flush 1.2s ease-in-out infinite}
.octy.t-rainbow .spots circle{animation:o-rainbow 1.8s linear infinite}
.octy.t-camo .body-all{animation:o-camo 3.2s ease-in-out infinite}
.octy .pulse{animation:o-pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.octy .rise{animation:o-rise 2.2s ease-out infinite}.octy .rise.d2{animation-delay:.7s}.octy .rise.d3{animation-delay:1.4s}
.octy .spin{animation:o-spin 2.2s linear infinite;transform-box:fill-box;transform-origin:center}
.octy .float{animation:o-float 2.4s ease-in-out infinite}
.octy .talk{animation:o-talk .28s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
.octy .ink{animation:o-ink 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.octy .ink.d2{animation-delay:.25s}.octy .ink.d3{animation-delay:.5s}
.octy .cf{animation:o-conf 1.6s ease-in infinite}
@media (prefers-reduced-motion:reduce){.octy *,.octy{animation:none!important}}

.octy .head{transform-origin:100px 132px}.octy .eyes{transform-origin:100px 100px}
@keyframes o-drift{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes o-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}
@keyframes o-glint{0%,88%,100%{opacity:0}92%{opacity:1}}
.octy.a-drift .body-all{animation:o-drift 4s ease-in-out infinite}
.octy.a-drift .shadow{animation:o-shadow 4s ease-in-out infinite;transform-origin:100px 190px}
.octy .glint{animation:o-glint 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.octy *,.octy{animation:none!important}}
</style>
